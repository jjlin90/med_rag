dependencies = [
    "addict==2.4.0",
    "beautifulsoup4>=4.12.0",
    "chardet>=3.0.2,<6",
    "charset-normalizer>=2,<4",
    "datasets==3.3.1",
    "fastapi==0.115.12",
    "flagembedding==1.3.5",
    "jieba>=0.42.1",
    "langchain-community==0.2.19",
    "langchain-core==0.2.43",
    "langchain-experimental==0.0.65",
    "langchain-openai==0.1.25",
    "langchain-text-splitters==0.2.4",
    "langchain-unstructured==0.1.2",
    "langgraph==0.2.76",
    "markdown==3.6",
    "milvus-model==0.2.5",
    "modelscope==1.23.0",
    "nltk==3.9.1",
    "numpy==1.26.4",
    "openai>=1.109.1",
    "opencv-python==4.10.0.84",
    "pandas==2.3.1",
    "peft==0.18.1",
    "pillow==10.4.0",
    "pymilvus==2.5.4",
    "pymupdf==1.23.16",
    "pymysql==1.1.1",
    "python-docx==1.1.2",
    "python-dotenv==1.0.1",
    "python-pptx==0.6.23",
    "ragas==0.2.6",
    "rank-bm25==0.2.2",
    "rapidocr-onnxruntime==1.3.25",
    "redis==5.3.1",
    "requests==2.32.5",
    "scikit-learn>=1.3.0",
    "sentence-transformers==3.0.1",
    "sentencepiece==0.2.0",
    "setuptools==78.1.1",
    "simplejson==3.19.2",
    "sortedcontainers==2.4.0",
    "starlette==0.46.2",
    "tiktoken==0.7.0",
    "torch>=2.1.0",
    "transformers==4.45.0",
    "unstructured==0.11.0",
    "urllib3>=1.21.1,<3",
    "uvicorn>=0.24.0",
