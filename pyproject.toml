[project]
name = "med-rag"
version = "0.1.0"
description = "Medical knowledge retrieval and question answering demo"
readme = "README.md"
authors = [
    { name = "JJLIN" }
]
requires-python = ">=3.10,<3.11"
dependencies = [
    "addict==2.4.0",
    "beautifulsoup4>=4.12.0",
    "chardet>=3.0.2,<6",
    "charset-normalizer>=2,<4",
    "datasets==3.3.1",
    "fastapi==0.115.12",
    "flagembedding==1.3.5",
    "jieba>=0.42.1",
    "langchain-community==0.2.19",
    "langchain-core==0.2.43",
    "langchain-experimental==0.0.65",
    "langchain-openai==0.1.25",
    "langchain-text-splitters==0.2.4",
    "langchain-unstructured==0.1.2",
    "langgraph==0.2.76",
    "markdown==3.6",
    "milvus-model==0.2.5",
    "modelscope==1.23.0",
    "nltk==3.9.1",
    "numpy==1.26.4",
    "openai>=1.109.1",
    "opencv-python==4.10.0.84",
    "packaging>=23.2",
    "pandas==2.3.1",
    "peft==0.18.1",
    "pillow==10.4.0",
    "pymilvus==2.5.4",
    "pymupdf==1.23.16",
    "pymysql[rsa]==1.1.1",
    "python-docx==1.1.2",
    "python-dotenv==1.0.1",
    "python-pptx==0.6.23",
    "ragas==0.2.6",
    "rank-bm25==0.2.2",
    "rapidocr-onnxruntime==1.3.25",
    "redis==5.3.1",
    "requests==2.32.5",
    "scikit-learn>=1.3.0",
    "sentence-transformers==3.0.1",
    "sentencepiece==0.2.0",
    "setuptools==78.1.1",
    "simplejson==3.19.2",
    "sortedcontainers==2.4.0",
    "starlette==0.46.2",
    "tiktoken==0.7.0",
    "torch==2.13.0",
    "transformers==4.45.0",
    "unstructured==0.11.0",
    "urllib3>=1.21.1,<3",
    "uvicorn>=0.24.0",
    "websockets>=16.1.1",
    "wikipedia==1.4.0",
]

[project.scripts]
med-rag = "main:main"

[project.optional-dependencies]
demo = ["streamlit>=1.37,<2", "pyarrow>=7,<25"]

# ========== 切换 setuptools 后端 ==========
[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

# Windows/Linux 的 uv 安装统一使用 PyTorch cu126 索引。
# 正式运行要求 NVIDIA CUDA GPU；Config 在启动时校验可用性。
# pip 不读取 tool.uv.sources，须按 GETTING_STARTED.md 单独安装 CUDA wheel。
[tool.uv]
environments = ["sys_platform == 'win32' or sys_platform == 'linux'"]

[tool.uv.sources]
torch = [
    { index = "pytorch-cu126", marker = "sys_platform == 'win32' or sys_platform == 'linux'" },
]

[[tool.uv.index]]
name = "pytorch-cu126"
url = "https://download.pytorch.org/whl/cu126"
explicit = true   # 仅对上述显式指定的包生效，不污染其它依赖的解析

# 自动扫描本地源码包：
[tool.setuptools.packages.find]
where = ["."]
include = ["src", "src.config*", "src.offline_pipeline*", "src.online_service*", "src.utils*", "scripts"]
exclude = ["src.models*", "scripts.__pycache__*"]

[tool.setuptools]
py-modules = ["main"]
