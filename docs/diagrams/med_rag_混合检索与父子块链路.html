<!doctype html><html lang="zh-CN"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>med_rag_混合检索与父子块链路</title><style>body{margin:0;background:#f3f6fa;font-family:Microsoft YaHei,sans-serif}main{max-width:1600px;margin:auto;padding:16px}svg{width:100%;height:auto}p{line-height:1.7}</style><main><p>按代码配置绘制，已删除HNSW、200题网格搜索、最优权重等无依据表述。 <a href="../med_rag_学习与面试全解.md">完整代码核查与边界</a></p><svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1970" viewBox="0 0 1600 1970"><rect width="100%" height="100%" fill="#f3f6fa"/>
<text x="60" y="78" font-family="Microsoft YaHei,sans-serif" font-size="38" font-weight="700" fill="#172f47">混合检索与父子块：每次检索的正常L0链路</text>
<text x="60" y="117" font-family="Microsoft YaHei,sans-serif" font-size="21" font-weight="400" fill="#52647a">2026-09-15校订｜两路检索融合不是Cross-Encoder精排；子块打分与父正文生成分开</text>
<rect x="300" y="160" width="1000" height="105" rx="15" fill="#ffffff" stroke="#b4c5d7" stroke-width="2"/>
<text x="322" y="199" font-family="Microsoft YaHei,sans-serif" font-size="25" font-weight="700" fill="#172f47">查询文本 → BGE-M3 encode</text>
<text x="322" y="231" font-family="Microsoft YaHei,sans-serif" font-size="21" font-weight="400" fill="#172f47">dense 1024维 + sparse lexical weights；ColBERT关闭</text>
<path d="M620 265 L420 325" stroke="#54748e" stroke-width="3"/>
<polygon points="420.0,325.0 429.1,315.8 432.7,327.7" fill="#54748e"/>
<path d="M980 265 L1180 325" stroke="#54748e" stroke-width="3"/>
<polygon points="1180.0,325.0 1167.3,327.7 1170.9,315.8" fill="#54748e"/>
<rect x="60" y="325" width="700" height="165" rx="15" fill="#e8eef6" stroke="#b4c5d7" stroke-width="2"/>
<text x="82" y="364" font-family="Microsoft YaHei,sans-serif" font-size="25" font-weight="700" fill="#172f47">dense：IVF_FLAT / IP</text>
<text x="82" y="396" font-family="Microsoft YaHei,sans-serif" font-size="21" font-weight="400" fill="#172f47">nlist=256；nprobe=16；最多16候选</text>
<text x="82" y="423" font-family="Microsoft YaHei,sans-serif" font-size="21" font-weight="400" fill="#172f47">两路均下推source条件与子块过滤</text>
<text x="82" y="450" font-family="Microsoft YaHei,sans-serif" font-size="21" font-weight="400" fill="#172f47">近似检索，不是HNSW</text>
<rect x="840" y="325" width="700" height="165" rx="15" fill="#e8eef6" stroke="#b4c5d7" stroke-width="2"/>
<text x="862" y="364" font-family="Microsoft YaHei,sans-serif" font-size="25" font-weight="700" fill="#172f47">sparse：SPARSE_INVERTED_INDEX / IP</text>
<text x="862" y="396" font-family="Microsoft YaHei,sans-serif" font-size="21" font-weight="400" fill="#172f47">drop_ratio_search=0.2；最多16候选</text>
<text x="862" y="423" font-family="Microsoft YaHei,sans-serif" font-size="21" font-weight="400" fill="#172f47">BGE词权稀疏向量，不是FAQ的BM25</text>
<text x="862" y="450" font-family="Microsoft YaHei,sans-serif" font-size="21" font-weight="400" fill="#172f47">drop_ratio_build=0.2</text>
<path d="M420 490 L650 550" stroke="#54748e" stroke-width="3"/>
<polygon points="650.0,550.0 637.4,553.2 640.5,541.1" fill="#54748e"/>
<path d="M1180 490 L950 550" stroke="#54748e" stroke-width="3"/>
<polygon points="950.0,550.0 959.5,541.1 962.6,553.2" fill="#54748e"/>
<rect x="300" y="550" width="1000" height="115" rx="15" fill="#ffffff" stroke="#b4c5d7" stroke-width="2"/>
<text x="322" y="589" font-family="Microsoft YaHei,sans-serif" font-size="25" font-weight="700" fill="#172f47">WeightedRanker(dense=1.0, sparse=0.7)</text>
<text x="322" y="621" font-family="Microsoft YaHei,sans-serif" font-size="21" font-weight="400" fill="#172f47">融合结果最多16条；不是16+16=32条最终候选</text>
<text x="322" y="648" font-family="Microsoft YaHei,sans-serif" font-size="21" font-weight="400" fill="#172f47">SDK调用负责融合；无本项目网格搜索最优性证据</text>
<path d="M800 665 L800 710" stroke="#54748e" stroke-width="3"/>
<polygon points="800.0,710.0 793.8,698.6 806.2,698.6" fill="#54748e"/>
<rect x="300" y="710" width="1000" height="135" rx="15" fill="#ffffff" stroke="#b4c5d7" stroke-width="2"/>
<text x="322" y="749" font-family="Microsoft YaHei,sans-serif" font-size="25" font-weight="700" fill="#172f47">子块校验 → 取前5有效子块</text>
<text x="322" y="781" font-family="Microsoft YaHei,sans-serif" font-size="21" font-weight="400" fill="#172f47">新schema：chunk_type=child；旧schema：parent_id非空</text>
<text x="322" y="808" font-family="Microsoft YaHei,sans-serif" font-size="21" font-weight="400" fill="#172f47">缺parent_id会剔除并打点；存量父块误标child仍可能抢位</text>
<text x="322" y="835" font-family="Microsoft YaHei,sans-serif" font-size="21" font-weight="400" fill="#172f47">16→5是每次调用上限，subquery每个问题分别执行</text>
<path d="M800 845 L800 890" stroke="#54748e" stroke-width="3"/>
<polygon points="800.0,890.0 793.8,878.6 806.2,878.6" fill="#54748e"/>
<rect x="300" y="890" width="1000" height="140" rx="15" fill="#ffffff" stroke="#b4c5d7" stroke-width="2"/>
<text x="322" y="929" font-family="Microsoft YaHei,sans-serif" font-size="25" font-weight="700" fill="#172f47">按parent_id聚合 / 去重（最多5条父记录）</text>
<text x="322" y="961" font-family="Microsoft YaHei,sans-serif" font-size="21" font-weight="400" fill="#172f47">content：优先冗余parent_content，缺失用子正文</text>
<text x="322" y="988" font-family="Microsoft YaHei,sans-serif" font-size="21" font-weight="400" fill="#172f47">rerank_content：该父块最高融合分命中子块</text>
<text x="322" y="1015" font-family="Microsoft YaHei,sans-serif" font-size="21" font-weight="400" fill="#172f47">通常不二次查父块；不等于把整个疾病章节或原文件取回</text>
<path d="M800 1030 L800 1075" stroke="#54748e" stroke-width="3"/>
<polygon points="800.0,1075.0 793.8,1063.6 806.2,1063.6" fill="#54748e"/>
<rect x="300" y="1075" width="1000" height="145" rx="15" fill="#ffffff" stroke="#b4c5d7" stroke-width="2"/>
<text x="322" y="1114" font-family="Microsoft YaHei,sans-serif" font-size="25" font-weight="700" fill="#172f47">原用户问题 × rerank_content → Cross-Encoder</text>
<text x="322" y="1146" font-family="Microsoft YaHei,sans-serif" font-size="21" font-weight="400" fill="#172f47">BGE-reranker-large，重排后最多取2条</text>
<text x="322" y="1173" font-family="Microsoft YaHei,sans-serif" font-size="21" font-weight="400" fill="#172f47">不是先把全部子块精排再回溯；每父记录使用一条代表证据</text>
<text x="322" y="1200" font-family="Microsoft YaHei,sans-serif" font-size="21" font-weight="400" fill="#172f47">subquery先合并去重，再统一用原问题重排</text>
<path d="M800 1220 L800 1265" stroke="#54748e" stroke-width="3"/>
<polygon points="800.0,1265.0 793.8,1253.6 806.2,1253.6" fill="#54748e"/>
<rect x="300" y="1265" width="1000" height="110" rx="15" fill="#ffffff" stroke="#b4c5d7" stroke-width="2"/>
<text x="322" y="1304" font-family="Microsoft YaHei,sans-serif" font-size="25" font-weight="700" fill="#172f47">最多2条content拼上下文 → 最终LLM生成</text>
<text x="322" y="1336" font-family="Microsoft YaHei,sans-serif" font-size="21" font-weight="400" fill="#172f47">L0通常为较大父窗口；数量可能不足2，也可能来自同一原文</text>
<rect x="60" y="1430" width="1480" height="210" rx="15" fill="#fff4df" stroke="#b4c5d7" stroke-width="2"/>
<text x="82" y="1469" font-family="Microsoft YaHei,sans-serif" font-size="25" font-weight="700" fill="#172f47">L1 / L2 例外</text>
<text x="82" y="1501" font-family="Microsoft YaHei,sans-serif" font-size="21" font-weight="400" fill="#172f47">L0空且允许L1：去掉子块过滤重查，取前5命中，父块内存切成约400字符片段。</text>
<text x="82" y="1528" font-family="Microsoft YaHei,sans-serif" font-size="21" font-weight="400" fill="#172f47">L1候选总量最多16，片段沿用父命中融合分；精排和生成使用子片段，不自动返回大父正文。</text>
<text x="82" y="1555" font-family="Microsoft YaHei,sans-serif" font-size="21" font-weight="400" fill="#172f47">L1更大候选上限、末尾截断和重新切分都可能改变质量/成本，不能宣称风险不增或成本不增。</text>
<text x="82" y="1582" font-family="Microsoft YaHei,sans-serif" font-size="21" font-weight="400" fill="#172f47">L1仍空或上层捕获故障时返回L2；默认不调用最终生成器。底层吞异常、部分失败透传存在缺口。</text>
<text x="82" y="1609" font-family="Microsoft YaHei,sans-serif" font-size="21" font-weight="400" fill="#172f47">缺langchain时L1使用固定滑窗；离线切块另有备选实现缺陷，不能保证任何环境完全同构。</text>
<rect x="60" y="1690" width="1480" height="215" rx="15" fill="#e8eef6" stroke="#b4c5d7" stroke-width="2"/>
<text x="82" y="1729" font-family="Microsoft YaHei,sans-serif" font-size="25" font-weight="700" fill="#172f47">离线产物与本次核验</text>
<text x="82" y="1761" font-family="Microsoft YaHei,sans-serif" font-size="21" font-weight="400" fill="#172f47">父2000 / 子400 / overlap60，按len字符切分；BGE max_length2048按token计，两者不是同一单位。</text>
<text x="82" y="1788" font-family="Microsoft YaHei,sans-serif" font-size="21" font-weight="400" fill="#172f47">父子块都向量化并insert入同一集合；子块保存parent_id和冗余parent_content。</text>
<text x="82" y="1815" font-family="Microsoft YaHei,sans-serif" font-size="21" font-weight="400" fill="#172f47">本地20816条＝3936逻辑父块＋16880子块；ID无重复、父ID引用与冗余正文一致。</text>
<text x="82" y="1842" font-family="Microsoft YaHei,sans-serif" font-size="21" font-weight="400" fill="#172f47">但顶层chunk_type全为child，3936条父类型错误；重新建集合不会自动修正旧JSON。</text>
<text x="82" y="1869" font-family="Microsoft YaHei,sans-serif" font-size="21" font-weight="400" fill="#172f47">这是本地文件核验，不代表在线Milvus当前记录数；本次未重建索引或做在线召回实验。</text>
</svg></main></html>
